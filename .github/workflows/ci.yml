name: CI

# 每次 push / PR 的**快速编译与单测**（不发版、不签名、不打包 APK）：
#   · android —— i18n 门禁 + 四个渠道变体的 Kotlin 编译 + JVM 单测
#   · rust    —— core/ 的 check / test / clippy（原 `build-core.yml` 并入这里）
#
# 发版仍然走两条完整矩阵：
#   · build-beta.yml    —— 渠道矩阵（debug / dev / test / perfBeta），Pre-release
#   · build-release.yml —— 正式版（release 签名），稳定 Release
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# 同一分支连推时取消上一次 —— 编译类检查没有必要排队跑旧提交
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # i18n 门禁排在工具链之前：只解析 XML，几毫秒；不达标就没必要再拉 Gradle。
      - name: i18n 校验
        run: python3 tools/i18n/check-i18n.py --min-coverage 100

      - uses: ./.github/actions/setup-branchbase-env
        with:
          gradle-cache-read-only: 'false'

      # 只编译、不打包：打包需要 Rust 的 .so（由发版流水线构建）。
      # **一个 job 只编一个变体**：四个 Compose 编译塞进同一个 Gradle 进程会在代码生成阶段 OOM
      # （2026-11-24 实测）。其余渠道由下面的 android-variants 矩阵各自编译。
      - name: Kotlin 编译（debug）+ JVM 单测
        run: |
          set -o pipefail
          ./gradlew --console=plain \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            :translate:testDebugUnitTest

  # 其余渠道各自一个 job（矩阵）：每个 job 只编一个变体，峰值内存回到单变体水平。
  android-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: [compileDevKotlin, compileTrialKotlin, compilePerfBetaKotlin]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-branchbase-env
        with:
          gradle-cache-read-only: 'false'

      - name: Kotlin 编译（${{ matrix.task }}）
        run: ./gradlew --console=plain :app:${{ matrix.task }}

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: core/target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      # git2 的 vendored libgit2 需要 cmake；vendored openssl 需要 cc/make（ubuntu 自带）。
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Cargo check（编译检查）
        run: cd core && cargo check --all-targets

      - name: Cargo test（单元测试）
        run: |
          cd core
          set -o pipefail
          if ! cargo test 2>&1 | tee /tmp/rust-test.log; then
            echo "::error title=rust-test::cargo test 失败，关键行如下"
            grep -aE "FAILED|failures:|panicked|assertion|left:|right:|^test .* \.\.\." /tmp/rust-test.log \
              | tail -40 \
              | while IFS= read -r line; do
                  safe=$(printf '%s' "$line" | tr -d '\r' | sed 's/::/%3A%3A/g')
                  echo "::error title=rust-test::$safe"
                done
            exit 1
          fi

      - name: Cargo clippy（静态检查，不阻塞）
        run: cd core && cargo clippy --all-targets -- -D warnings
        continue-on-error: true
