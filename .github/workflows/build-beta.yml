name: Build Beta (Channels)

# Beta 渠道矩阵（push 到 main 自动跑；也可手动触发）
#
#   ① version —— 算一次**钉住**的版本参数（四个渠道共用同一个时间戳，否则 APK 名字差一分钟对不上）
#   ② core    —— 编一次 Rust 核心 .so，作为 artifact 下发
#   ③ build   —— **矩阵**：debug / dev / trial / perfBeta 各自一个 job、各自一个 Gradle 进程
#                （2026-11-24：四渠道塞进一个 Gradle 调用会在 Compose 代码生成阶段 OOM；
#                 拆开后每个 job 只编一个变体，峰值内存回到单变体水平，同时四条腿并行跑）
#   ④ publish —— 汇总产物 / 双语发布页 / 提交 .so 与校验文件到 beta 分支 / 发 Pre-release
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      versionName: ${{ steps.ver.outputs.versionName }}
      versionCode: ${{ steps.ver.outputs.versionCode }}
      gitHash: ${{ steps.ver.outputs.gitHash }}
      buildTime: ${{ steps.ver.outputs.buildTime }}
      standardVersion: ${{ steps.ver.outputs.standardVersion }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # i18n 门禁：只解析 XML，几毫秒；排在所有构建之前，不达标就不必再花钱跑流水线。
      - name: i18n 校验
        run: python3 tools/i18n/check-i18n.py --min-coverage 100

      - name: 版本参数（四个渠道共用）
        id: ver
        run: |
          set -euo pipefail
          V=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          C=$(grep '^versionCode=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          H=$(git rev-parse --short=7 HEAD)
          T=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)
          S="${V}-${T}-${H}"
          {
            echo "versionName=$V"
            echo "versionCode=$C"
            echo "gitHash=$H"
            echo "buildTime=$T"
            echo "standardVersion=$S"
          } >> "$GITHUB_OUTPUT"
          echo "[version] $S"

  core:
    runs-on: ubuntu-latest
    needs: version
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-branchbase-env
        with:
          gradle-cache-read-only: 'false'

      # 核心没改就复用上次的 .so（键只含 core/**）：纯 UI 提交的发版不再等一轮 Rust 交叉编译。
      - name: Restore Rust core cache
        id: so-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libbranchbase_core.so
          key: core-so-${{ runner.os }}-${{ hashFiles('core/**') }}

      - name: Build Rust core (.so)
        if: steps.so-cache.outputs.cache-hit != 'true'
        run: bash tools/build/build-core.sh --mode=ci

      - name: Upload artifact（libbranchbase_core.so，不打包）
        uses: actions/upload-artifact@v7
        with:
          path: app/src/main/jniLibs/arm64-v8a/libbranchbase_core.so
          retention-days: 30
          if-no-files-found: error
          archive: false

  build:
    runs-on: ubuntu-latest
    needs: [version, core]
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: debug
            task: assembleDebug
            outDir: debug
          - channel: dev
            task: assembleDev
            outDir: dev
          - channel: trial
            task: assembleTrial
            outDir: trial
          # perfBeta：非 debuggable（ART 才做 AOT、AGP 才合入 baseline profile），
          # 沿用入库的固定 beta 钥匙，可以覆盖安装 —— 评性能用它。
          - channel: perfBeta
            task: assemblePerfBeta
            outDir: perfBeta
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-branchbase-env
        with:
          gradle-cache-read-only: 'false'

      - name: Download Rust core (.so)
        uses: actions/download-artifact@v8
        with:
          name: libbranchbase_core.so
          path: app/src/main/jniLibs/arm64-v8a/

      - name: Inject client secret
        run: echo "branchbase.client.secret=${{ secrets.BRANCHBASE_CLIENT_SECRET }}" >> local.properties

      # 四个渠道共用 version job 钉住的版本参数 —— 不这样做，每个 leg 各自算时间戳，
      # APK 名字会差一分钟，发布页按名字取附件就取不到。
      - name: Assemble ${{ matrix.channel }}
        env:
          BRANCHBASE_GIT_HASH: ${{ needs.version.outputs.gitHash }}
          BRANCHBASE_BUILD_TIME: ${{ needs.version.outputs.buildTime }}
          BRANCHBASE_STANDARD_VERSION: ${{ needs.version.outputs.standardVersion }}
        run: |
          set -o pipefail
          if ! bash tools/build/assemble.sh ${{ matrix.task }} 2>&1 | tee /tmp/assemble.log; then
            echo "::error title=assemble::${{ matrix.channel }} 编译失败，关键行如下"
            {
              grep -aE "^e: |^error:" /tmp/assemble.log | tail -12
              awk '/^FAILURE:|What went wrong/{flag=1} flag{print; n++} n>=30{exit}' /tmp/assemble.log
            } | tail -40 \
              | while IFS= read -r line; do
                  safe=$(printf '%s' "$line" | tr -d '\r' | sed 's/::/%3A%3A/g' | cut -c1-400)
                  echo "::error title=assemble::$safe"
                done
            exit 1
          fi

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/${{ matrix.outDir }}/*.apk dist/ || true
          ls -la dist/

      # 签名指纹从**实际产物**现算（四个渠道同一把 beta 钥匙，取 debug 那份即可）。
      # 放在 build 阶段是因为这里才有 Android SDK（apksigner 随 build-tools 由 AGP 装好）。
      - name: Generate signature file（现算指纹，仅 debug）
        if: matrix.channel == 'debug'
        run: |
          set -uo pipefail
          APKSIGNER=$(command -v apksigner || true)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(ls "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)
          fi
          echo "apksigner=${APKSIGNER:-<未找到>}"
          APK=$(ls dist/*-debug.apk | head -1)
          RAW=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)
          echo "--- apksigner output（前 8 行）---"
          printf '%s\n' "$RAW" | head -8
          FPRINT=$(printf '%s\n' "$RAW" | grep -oE '[0-9a-fA-F]{64}' | head -1 \
            | tr '[:lower:]' '[:upper:]' | sed -E 's/(..)/\1:/g; s/:$//')
          if [ -z "$FPRINT" ]; then
            echo "::error title=signature::无法从 $APK 读出签名指纹（见上面的 apksigner 输出）"
            exit 1
          fi
          {
            echo "variant=beta"
            echo "version=${{ needs.version.outputs.standardVersion }}"
            echo "fingerprint=$FPRINT"
          } > dist/signature.txt
          cat dist/signature.txt

      - name: Upload artifact（APK，不打包）
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error
          archive: false

      - name: Upload artifact（signature.txt，不打包，仅 debug）
        if: matrix.channel == 'debug'
        uses: actions/upload-artifact@v7
        with:
          path: dist/signature.txt
          retention-days: 30
          if-no-files-found: error
          archive: false

  publish:
    runs-on: ubuntu-latest
    needs: [version, core, build]
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*'
          merge-multiple: true

      # 指纹由 build 阶段从实际 APK 现算并上传；这里只把它放回 verify/ 供提交与发布。
      - name: Collect signature file
        run: |
          test -s signature.txt || { echo "::error::缺少 build 阶段产出的 signature.txt"; exit 1; }
          mkdir -p verify
          rm -f verify/signature.txt
          mv signature.txt verify/signature.txt
          cat verify/signature.txt

      - name: Generate beta tag
        id: tag
        run: echo "tag=v${{ needs.version.outputs.standardVersion }}-beta" >> "$GITHUB_OUTPUT"

      # 改动记录：发布页必须能看出「这次发了什么」。英文段在最前（展示优先级），中文是权威正文。
      - name: 生成改动记录（锚定上一个 beta 标签）
        id: notes
        run: |
          bash tools/build/release-notes.sh \
            --repo "${{ github.repository }}" \
            --tag "${{ steps.tag.outputs.tag }}" \
            --previous-pattern 'v*-beta' \
            --exclude-author 'github-actions[bot]' \
            --previous-out previous-tag.txt >> release-body.md
          echo "previous=$(cat previous-tag.txt)" >> "$GITHUB_OUTPUT"
          cat release-body.md

      - name: 代码变更整合（提交 .so + 校验到 beta 分支）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp libbranchbase_core.so app/src/main/jniLibs/arm64-v8a/
          git checkout -B beta
          git add -f verify/signature.txt app/src/main/jniLibs/arm64-v8a/libbranchbase_core.so
          git commit -m "chore: 更新测试版校验配置与 .so v${{ needs.version.outputs.versionName }}" || echo "无变更"
          git push origin beta --force || true

      - name: 类型判定发布（pre-release）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Beta 测试版 ${{ steps.tag.outputs.tag }}
          body_path: release-body.md
          generate_release_notes: true
          previous_tag: ${{ steps.notes.outputs.previous }}
          # 显式路径 + fail_on_unmatched_files：glob 一个都没匹配时 action 默认仍算成功，
          # 会发布一个「没有附件」的 release（v1.0.73-beta 的教训）。
          files: |
            Branchbase-${{ needs.version.outputs.standardVersion }}-debug.apk
            Branchbase-${{ needs.version.outputs.standardVersion }}-dev.apk
            Branchbase-${{ needs.version.outputs.standardVersion }}-test.apk
            Branchbase-${{ needs.version.outputs.standardVersion }}-perfBeta.apk
            verify/signature.txt
          fail_on_unmatched_files: true
          prerelease: true
          draft: false

      - name: 追加版本信息到发布页末尾
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          BODY=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body -q .body)
          {
            printf '%s\n\n' "$BODY"
            echo "---"
            echo ""
            echo "### 版本信息"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | \`$TAG\` |"
            echo "| 标准版本号 | \`${{ needs.version.outputs.standardVersion }}\` |"
            echo "| 版本码 | \`${{ needs.version.outputs.versionCode }}\` |"
            echo "| 提交 | \`${{ needs.version.outputs.gitHash }}\` |"
            echo "| 构建时间 | ${{ needs.version.outputs.buildTime }} |"
          } > /tmp/new-body.md
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file /tmp/new-body.md

      - name: 核对发布附件数
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          N=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets | length' 2>/dev/null || echo "")
          if [ "${N:-0}" -lt 5 ]; then
            echo "::warning title=发布附件数异常::$TAG 期望 5 个附件（debug / dev / test / perfBeta APK + signature.txt），接口返回 '${N:-取不到}' 个。⚠️ REST 接口有低报先例，请以发布页为准，不要据此判断构建失败"
          fi
