name: Build Beta (Debug)

# Beta 测试版：三步骤流水线
#   ① prepare —— 环境准备 / 检索资产 / 判定缓存命中（写缓存）
#   ② build   —— 执行编译（编译 .so + assembleDebug），注入关键版本参数
#   ③ publish —— 收集产物 / 类型判定发布（pre-release）/ 代码变更整合（提交 .so 到 beta 分支）
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: 环境准备 / 检索资产 / 判定命中
        uses: ./.github/actions/setup-branchbase-env
        with:
          gradle-cache-read-only: 'false'

  build:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      actions: write
    outputs:
      versionName: ${{ steps.ver.outputs.versionName }}
      versionCode: ${{ steps.ver.outputs.versionCode }}
      gitHash: ${{ steps.ver.outputs.gitHash }}
      buildTime: ${{ steps.ver.outputs.buildTime }}
      standardVersion: ${{ steps.ver.outputs.standardVersion }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-branchbase-env
        with:
          gradle-cache-read-only: 'false'

      - name: Inject client secret
        run: echo "branchbase.client.secret=${{ secrets.BRANCHBASE_CLIENT_SECRET }}" >> local.properties

      - name: Build Rust core (.so)
        run: bash tools/build/build-core.sh --mode=ci

      - name: Build Debug APK (注入版本参数)
        id: ver
        run: |
          set -o pipefail
          if ! bash tools/build/assemble.sh assembleDebug 2>&1 | tee /tmp/assemble.log; then
            # 失败时把关键行做成 annotation —— 无需日志下载权限即可通过 check-runs API 定位
            echo "::error title=assemble::assembleDebug 失败，关键行如下"
            # 先取 Kotlin 编译错误，再取 Gradle FAILURE 段（真实原因在 FAILURE 之后）
            {
              grep -aE "^e: |^error:" /tmp/assemble.log | tail -12
              awk '/^FAILURE:|What went wrong/{flag=1} flag{print; n++} n>=30{exit}' /tmp/assemble.log
            } | tail -40 \
              | while IFS= read -r line; do
                  safe=$(printf '%s' "$line" | tr -d '\r' | sed 's/::/%3A%3A/g' | cut -c1-400)
                  echo "::error title=assemble::$safe"
                done
            exit 1
          fi

      - name: Collect artifacts (复制到非 gitignore 的 dist/)
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/ || true
          cp app/src/main/jniLibs/arm64-v8a/libbranchbase_core.so dist/ || true
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beta-artifacts
          path: dist/
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: beta-artifacts

      - name: Generate signature file
        run: |
          mkdir -p verify
          rm -f verify/signature.txt
          echo "variant=beta" > verify/signature.txt
          echo "version=${{ needs.build.outputs.standardVersion }}" >> verify/signature.txt
          echo "fingerprint=AC:AB:BC:09:9F:91:81:8B:58:C5:45:DD:7F:D6:4D:E5:E2:8D:13:31:9E:63:E6:E3:73:02:2B:BB:90:19:F3:DD" >> verify/signature.txt

      - name: Generate beta tag
        id: tag
        run: echo "tag=v${{ needs.build.outputs.standardVersion }}-beta" >> "$GITHUB_OUTPUT"

      # 改动记录：发布页必须能看出「这次发了什么」。
      # 锚定上一个 beta 标签 → 本次标签，逐条列出提交（带 commit 链接）+ 完整对比链接。
      # ⚠️ 必须排在「代码变更整合（提交 .so 到 beta 分支）」**之前**：那一步会把 HEAD
      # 变成 CI 自己产生的提交，之后再取范围就会把这条内部提交也列进改动记录。
      - name: 生成改动记录（锚定上一个 beta 标签）
        id: notes
        run: |
          {
            echo "🧪 **Beta 测试版（Debug 签名）**"
            echo ""
            echo "- 版本：\`${{ steps.tag.outputs.tag }}\`"
            echo "- 标准版本号：\`${{ needs.build.outputs.standardVersion }}\`"
            echo "- 提交：\`${{ needs.build.outputs.gitHash }}\` · 构建时间：${{ needs.build.outputs.buildTime }}"
            echo ""
          } > release-body.md
          bash tools/build/release-notes.sh \
            --repo "${{ github.repository }}" \
            --tag "${{ steps.tag.outputs.tag }}" \
            --previous-pattern 'v*-beta' \
            --exclude-author 'github-actions[bot]' \
            --previous-out previous-tag.txt >> release-body.md
          echo "previous=$(cat previous-tag.txt)" >> "$GITHUB_OUTPUT"
          cat release-body.md

      - name: 代码变更整合（提交 .so + 校验到 beta 分支）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # upload dist/ 时以 dist 为 root，download 后 .so 落在 workspace 根（不带 dist/ 前缀）
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp libbranchbase_core.so app/src/main/jniLibs/arm64-v8a/
          git checkout -B beta
          git add -f verify/signature.txt app/src/main/jniLibs/arm64-v8a/libbranchbase_core.so
          git commit -m "chore: 更新测试版校验配置与 .so v${{ needs.build.outputs.versionName }}" || echo "无变更"
          git push origin beta --force || true

      - name: 类型判定发布（pre-release）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Beta 测试版 ${{ steps.tag.outputs.tag }}
          body_path: release-body.md
          # 官方自动生成说明（合并的 PR + 贡献者 + 完整变更链接），分类见 .github/release.yml；
          # action 会把上面的 body 前置到官方说明之前（body + "\n\n" + generated）
          generate_release_notes: true
          # 让官方的「完整变更」链接也锚定上一个 beta 标签，而不是 GitHub 自行挑选的基准
          previous_tag: ${{ steps.notes.outputs.previous }}
          files: |
            *.apk
            verify/signature.txt
          prerelease: true
          draft: false