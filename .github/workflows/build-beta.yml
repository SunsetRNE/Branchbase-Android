name: Build Beta (Debug)

# Beta 测试版：push 代码到 main 自动触发，CI 内交叉编译 Rust .so + 打包 APK，
# 发布为 pre-release（带 APK + 校验文件附件，pre-release 标记不占 Latest）。
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('core/Cargo.lock') }}

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: core/target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('core/Cargo.lock') }}

      - name: Read engineering version
        id: ver
        run: echo "ver=$(grep versionName version.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Inject client secret
        run: echo "branchbase.client.secret=${{ secrets.BRANCHBASE_CLIENT_SECRET }}" >> local.properties

      - name: Build Rust core (.so)
        run: |
          cd core
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Generate signature file
        run: |
          mkdir -p verify
          rm -f verify/signature.txt
          echo "variant=beta" > verify/signature.txt
          echo "version=${{ steps.ver.outputs.ver }}-$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)-$(git rev-parse --short=7 HEAD)" >> verify/signature.txt
          echo "fingerprint=AC:AB:BC:09:9F:91:81:8B:58:C5:45:DD:7F:D6:4D:E5:E2:8D:13:31:9E:63:E6:E3:73:02:2B:BB:90:19:F3:DD" >> verify/signature.txt

      - name: Commit artifacts to beta branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B beta
          git add verify/signature.txt app/src/main/jniLibs/arm64-v8a/libbranchbase_core.so
          git commit -m "chore: 更新测试版校验配置与 .so v${{ steps.ver.outputs.ver }}" || echo "无变更"
          git push origin beta --force || true

      - name: Generate beta tag
        id: tag
        run: echo "tag=v${{ steps.ver.outputs.ver }}-$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)-$(git rev-parse --short=7 HEAD)-beta" >> "$GITHUB_OUTPUT"

      - name: Release Beta
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Beta 测试版 ${{ steps.tag.outputs.tag }}
          body: |
            🧪 Beta 测试版（Debug 签名）
            - 版本：`${{ steps.tag.outputs.tag }}`
          files: |
            app/build/outputs/apk/debug/*.apk
            verify/signature.txt
          prerelease: true
          draft: false