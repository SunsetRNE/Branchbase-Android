name: Build Release (正式版)

# 正式版：三步骤流水线（手动 workflow_dispatch 触发）
#   ① prepare —— 环境准备 / 检索资产 / 判定缓存命中（写缓存）
#   ② build   —— 执行编译（编译 .so + assembleRelease），注入关键版本参数 + 签名
#   ③ publish —— 收集产物 / 类型判定发布（正式 Release）/ 代码变更整合（源码包）
on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: 环境准备 / 检索资产 / 判定命中
        uses: ./.github/actions/setup-branchbase-env
        with:
          gradle-cache-read-only: 'false'

  build:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      actions: write
    outputs:
      versionName: ${{ steps.ver.outputs.versionName }}
      versionCode: ${{ steps.ver.outputs.versionCode }}
      gitHash: ${{ steps.ver.outputs.gitHash }}
      buildTime: ${{ steps.ver.outputs.buildTime }}
      standardVersion: ${{ steps.ver.outputs.standardVersion }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-branchbase-env
        with:
          gradle-cache-read-only: 'false'

      - name: Inject client secret
        run: echo "branchbase.client.secret=${{ secrets.BRANCHBASE_CLIENT_SECRET }}" >> local.properties

      - name: Build Rust core (.so)
        run: bash tools/build/build-core.sh --mode=ci

      - name: Build Release APK (注入版本参数 + 签名)
        id: ver
        run: bash tools/build/assemble.sh assembleRelease
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Collect artifacts (复制到非 gitignore 的 dist/)
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/ || true
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Generate signature file
        run: |
          echo "variant=release" > signature.txt
          echo "version=${{ needs.build.outputs.versionName }}" >> signature.txt
          echo "fingerprint=B3:72:AB:52:EE:47:A0:8E:45:26:6F:1C:11:E0:75:6D:86:E3:83:A0:74:BE:EB:A3:77:FD:3E:BA:7C:F7:99:94" >> signature.txt

      # 不建 tag：上一次正式版是哪个提交，记在 release 分支的 RELEASED_COMMIT 里。
      # 分支每次 force 更新（没有历史可查），所以锚点只能写进文件；
      # 用 raw 直链读它，避免为了一个小文件把 28MB 的 APK 一起 fetch 下来。
      - name: 读取上一次正式版的提交（发布记录锚点）
        id: prev
        run: |
          PREV=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/release/RELEASED_COMMIT" 2>/dev/null | tr -d '[:space:]' || true)
          echo "commit=$PREV" >> "$GITHUB_OUTPUT"
          echo "上一个正式版提交：${PREV:-（读不到，退回标签锚定）}"

      # 改动记录：不建 tag 时用「上一次发布的提交 → 本次提交」这段区间；
      # 读不到锚点（首次 / 仓库转私有导致 raw 不可匿名访问）时退回按标签锚定。
      - name: 生成改动记录
        run: |
          if [ -n "${{ steps.prev.outputs.commit }}" ]; then
            bash tools/build/release-notes.sh \
              --repo "${{ github.repository }}" \
              --tag "v${{ needs.build.outputs.versionName }}" \
              --from "${{ steps.prev.outputs.commit }}" \
              --to "$(git rev-parse HEAD)" \
              --exclude-author 'github-actions[bot]' > RELEASE-NOTES.md
          else
            bash tools/build/release-notes.sh \
              --repo "${{ github.repository }}" \
              --tag "v${{ needs.build.outputs.versionName }}" \
              --previous-pattern 'v*' \
              --exclude-substring '-beta' \
              --exclude-author 'github-actions[bot]' > RELEASE-NOTES.md
          fi
          cat RELEASE-NOTES.md

      - name: 代码变更整合（生成源码包）
        run: git archive --format=tar.gz -o "source-${{ needs.build.outputs.versionName }}.tar.gz" HEAD

      # 产物分发走 release 分支的 raw 直链：**不建 tag、不发 GitHub Release**。
      # 直链形如
      #   https://github.com/<owner>/<repo>/raw/release/<文件名>
      # 每次 force 更新 → 分支上只有一次发布的内容，仓库不会被历次 APK 撑大。
      - name: 发布产物到 release 分支（不建 tag / 不发 Release）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 记下本次发布的提交，供下一次发布当锚点
          git rev-parse HEAD > RELEASED_COMMIT
          git checkout -B release
          # 产物被 .gitignore 挡着，-f 强制入库
          git add -f *.apk signature.txt source-*.tar.gz RELEASE-NOTES.md RELEASED_COMMIT
          git commit -m "release: v${{ needs.build.outputs.versionName }} (${{ needs.build.outputs.gitHash }})" || echo "无变更"
          git push origin release --force
          echo "✅ 已推送到 release 分支（未创建 tag）" 