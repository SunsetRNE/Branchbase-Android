name: Build Release (正式版)

# 正式版：三步骤流水线（手动 workflow_dispatch 触发）
#   ① prepare —— 环境准备 / 检索资产 / 判定缓存命中（写缓存）
#   ② build   —— 执行编译（编译 .so + assembleRelease），注入关键版本参数 + 签名
#   ③ publish —— 收集产物 / 类型判定发布（正式 Release）/ 代码变更整合（源码包）
on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: 环境准备 / 检索资产 / 判定命中
        uses: ./.github/actions/setup-branchbase-env
        with:
          gradle-cache-read-only: 'false'

  build:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      actions: write
    outputs:
      versionName: ${{ steps.ver.outputs.versionName }}
      versionCode: ${{ steps.ver.outputs.versionCode }}
      gitHash: ${{ steps.ver.outputs.gitHash }}
      buildTime: ${{ steps.ver.outputs.buildTime }}
      standardVersion: ${{ steps.ver.outputs.standardVersion }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-branchbase-env
        with:
          gradle-cache-read-only: 'false'

      - name: Inject client secret
        run: echo "branchbase.client.secret=${{ secrets.BRANCHBASE_CLIENT_SECRET }}" >> local.properties

      - name: Build Rust core (.so)
        run: bash tools/build/build-core.sh --mode=ci

      - name: Build Release APK (注入版本参数 + 签名)
        id: ver
        run: bash tools/build/assemble.sh assembleRelease
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Collect artifacts (复制到非 gitignore 的 dist/)
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/ || true
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      # 改动记录：锚定上一个**正式版**标签（排除 beta），逐条列出提交 + 完整对比链接。
      # 原实现是 `git log -10`：没有链接、固定 10 条、且不知道上次发的是哪个版本。
      - name: 生成改动记录（锚定上一个正式版标签）
        id: notes
        run: |
          {
            echo "📦 **正式版 Release**"
            echo ""
            echo "- 版本：`v${{ needs.build.outputs.versionName }}`"
            echo "- 版本码：`${{ needs.build.outputs.versionCode }}` · 提交：`${{ needs.build.outputs.gitHash }}` · 构建时间：${{ needs.build.outputs.buildTime }}"
            echo ""
          } > release-body.md
          bash tools/build/release-notes.sh \
            --repo "${{ github.repository }}" \
            --tag "v${{ needs.build.outputs.versionName }}" \
            --previous-pattern 'v*' \
            --exclude-substring '-beta' \
            --exclude-author 'github-actions[bot]' \
            --previous-out previous-tag.txt >> release-body.md
          echo "previous=$(cat previous-tag.txt)" >> "$GITHUB_OUTPUT"
          cat release-body.md

      - name: Generate signature file
        run: |
          echo "variant=release" > signature.txt
          echo "version=${{ needs.build.outputs.versionName }}" >> signature.txt
          echo "fingerprint=B3:72:AB:52:EE:47:A0:8E:45:26:6F:1C:11:E0:75:6D:86:E3:83:A0:74:BE:EB:A3:77:FD:3E:BA:7C:F7:99:94" >> signature.txt

      - name: 代码变更整合（生成源码包）
        run: git archive --format=tar.gz -o "source-${{ needs.build.outputs.versionName }}.tar.gz" HEAD

      - name: 类型判定发布（正式 Release）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.versionName }}
          name: 正式版 v${{ needs.build.outputs.versionName }}
          body_path: release-body.md
          # 官方自动生成说明（合并的 PR + 贡献者 + 完整变更链接），分类见 .github/release.yml
          generate_release_notes: true
          previous_tag: ${{ steps.notes.outputs.previous }}
          files: |
            *.apk
            signature.txt
            source-${{ needs.build.outputs.versionName }}.tar.gz
          prerelease: false
          draft: false
          # 正式版设为 latest（Beta 是 pre-release，不会抢占）
          make_latest: true