# Branchbase 工程版本号配置（手动维护）
# 标准版本号 = 工程版本号 + "-" + 年月日-时分 + "-" + 七位哈希（例：1.1.1-20260925-1402-a1b2c3d）
# 标准版本号在构建时自动注入（见 app/build.gradle.kts），无需手动改这里。
#
# 工程版本号（semver：主=大版本.次=小版本.修订=长期性变更）
#
# **这个文件只有下面两个值**：逐版变更说明、写法约定、三个经典样板与 versionCode 完整流水
# 都在 docs/specs/VERSION-NOTES.md。加一版时：先去那份文档加条目（§二）与版本码流水（§三），
# 再回来改这两行。
versionName=1.1.3

# 工程版本码（整数：有多少次提交变更多少次 +1，一次发布也算一次提交）
versionCode=209
