# Branchbase 工程版本号配置（手动维护）
# 标准版本号 = 工程版本号 + "-" + 年月日-时分 + "-" + 七位哈希
# 例：1.0.1-20260901-1342-a1b2c3d
# 标准版本号在构建时自动注入（见 app/build.gradle.kts），无需手动改这里。

# 工程版本号（semver：主=大版本.次=小版本.修订=长期性变更）
# 1.0.17：沉浸式翻译的悬浮球 + 工具面板改原生 Compose 覆盖层 —— 钉在窗口右下角、
#         导航栏之上，面板不再受正文高度约束（正文比屏幕短时也能完整展开）
versionName=1.0.17

# 工程版本码（整数，每次发布递增，每次提交前变更，有多少次提交变更多少次版本码）
# 119：悬浮球/面板搬到原生层（去掉页面内可见带定位）
versionCode=119
