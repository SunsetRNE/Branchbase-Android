# Branchbase 工程版本号配置（手动维护）
# 标准版本号 = 工程版本号 + "-" + 年月日-时分 + "-" + 七位哈希
# 例：1.0.1-20260901-1342-a1b2c3d
# 标准版本号在构建时自动注入（见 app/build.gradle.kts），无需手动改这里。

# 工程版本号（semver：主=大版本.次=小版本.修订=长期性变更）
# 1.0.22：返回键消费链路补全 —— PageSwitcher 补上下发 LocalPageActive（退场旧页不再抢返回键）；
#         个人页下级页 / 本地仓库决策页 / 任务详情 / 文件页决策页与编辑态 / Issue 评论编辑态
#         各自消费返回键（与页面内返回箭头同一条路径）；Git 悬浮球绑定「本地仓库（Git）」模式
versionName=1.0.22

# 工程版本码（整数，每次发布递增，每次提交前变更，有多少次提交变更多少次版本码）
# 124：返回键消费补全 + Git 悬浮球绑定本地 Git 模式（一次提交，故 +1）
versionCode=124
