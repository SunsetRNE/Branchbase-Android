# Branchbase 固定镜像源（不再做镜像测速，按序直连，命中即用）
# 说明：本地 proot 环境已彻底放弃 ping/分段测速，走「预存资产 + 固定镜像」离线优先路径。
# 用法：source tools/env/mirrors.conf 后引用这些变量。

# Gradle 发行版镜像（固定腾讯云优先，阿里云兜底）
GRADLE_VERSION="9.1.0"
GRADLE_DIST="gradle-${GRADLE_VERSION}"
GRADLE_MIRROR="https://mirrors.cloud.tencent.com/gradle"
GRADLE_MIRROR_FALLBACK="https://mirrors.aliyun.com/gradle"

# Android cmdline-tools 镜像（固定腾讯云优先，阿里云兜底）
ANDROID_CMDLINE_TOOLS_VERSION="11076708"
ANDROID_CMDLINE_MIRROR="https://mirrors.cloud.tencent.com/android/repository"
ANDROID_CMDLINE_MIRROR_FALLBACK="https://mirrors.aliyun.com/android/repository"

# cargo-ndk 锁定版本（预编译下载，后续需要时再变更）
CARGO_NDK_VERSION="4.1.2"
