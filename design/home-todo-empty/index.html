<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>首页「待处理」：无框 + 可折叠 · 原型</title>
<!--
  一次性草图（不是产品 UI）：首页「待处理」区的 两版（现状黑框 / 新设计无框折叠）
  × 四种状态（有内容 / 空 / 加载中 / 取数失败）× 展开折叠。
  颜色全部取自 ui/theme/ThemePalette.kt 的 PrimerPalette（浅 / 深两套），
  字号与间距取自 ui/home/HomeScreen.kt 的现值，结论见 docs/specs/prototypes/home-todo-empty.md。
-->
<style>
  * { box-sizing: border-box; }

  html[data-theme="light"] {
    color-scheme: light;
    --canvas: #FFFFFF;
    --canvas-subtle: #FFFFFF;
    --text-1: #050505;
    --text-2: #41434E;
    --text-3: #6A6D7C;
    --icon-1: #000000;
    --icon-2: #9194A1;
    --border: #BFC1C9;
    --border-emphasis: #000000;
    --divider: rgba(0, 0, 0, 0.4);
    --fill: #F7F7F9;
    --fill-strong: #EFF0F5;
    --accent: #0969DA;
    --link: #0969DA;
    --success: #28A745;
    --success-surface: #F0FFF4;
    --info-soft: #E6F1FF;
    --warning-surface: #FFF1E0;
    --warning-strong: #7D4C00;
    --danger: #D73A49;
    --page-bg: #E9EBF0;
    --shimmer: #EDEEF2;
    --press: rgba(0, 0, 0, 0.045);
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --canvas: #0D1117;
    --canvas-subtle: #161B22;
    --text-1: #E6EDF3;
    --text-2: #C9D1D9;
    --text-3: #8B949E;
    --icon-1: #FFFFFF;
    --icon-2: #8B949E;
    --border: #30363D;
    --border-emphasis: #30363D;
    --divider: rgba(48, 54, 61, 0.85);
    --fill: #161B22;
    --fill-strong: #21262D;
    --accent: #1F6FEB;
    --link: #2F81F7;
    --success: #3FB950;
    --success-surface: #12261E;
    --info-soft: #10283F;
    --warning-surface: #2A2113;
    --warning-strong: #D29922;
    --danger: #F85149;
    --page-bg: #010409;
    --shimmer: #21262D;
    --press: rgba(255, 255, 255, 0.06);
  }

  body {
    margin: 0;
    padding: 20px 16px 40px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--page-bg);
    color: var(--text-1);
    -webkit-font-smoothing: antialiased;
  }

  /* ───────── 工具条（原型工具，非产品 UI） ───────── */
  .toolbar {
    max-width: 900px;
    margin: 0 auto 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    align-items: center;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--canvas-subtle);
    border: 1px solid var(--fill-strong);
  }
  .toolbar .group { display: flex; align-items: center; gap: 8px; }
  .toolbar .label { font-size: 12px; color: var(--text-3); white-space: nowrap; }
  .seg {
    display: inline-flex;
    padding: 2px;
    border-radius: 8px;
    background: var(--fill-strong);
  }
  .seg button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text-2);
    font: inherit;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
  }
  .seg button[aria-pressed="true"] {
    background: var(--canvas-subtle);
    color: var(--text-1);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
  }
  .seg button:disabled { opacity: .38; cursor: default; }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); cursor: pointer; }

  /* ───────── 手机框 ───────── */
  .stage {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    align-items: flex-start;
    justify-content: center;
  }
  .device {
    width: 390px;
    height: 844px;
    flex: 0 0 auto;
    border-radius: 34px;
    background: var(--canvas);
    border: 1px solid var(--fill-strong);
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.16);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .statusbar {
    height: 44px;
    flex: 0 0 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px 0 26px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-1);
  }
  .statusbar .right { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
  .statusbar .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 10px; }
  .statusbar .bars i { width: 3px; background: var(--text-1); border-radius: 1px; }
  .statusbar .batt { width: 20px; height: 10px; border: 1.5px solid var(--text-2); border-radius: 3px; position: relative; }
  .statusbar .batt::after { content: ""; position: absolute; inset: 1.5px; right: 5px; background: var(--text-2); border-radius: 1px; }

  .screen {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
  }
  .screen::-webkit-scrollbar { display: none; }

  /* 搜索栏 + 头像 */
  .topbar { display: flex; align-items: center; gap: 12px; padding: 2px 16px 12px; }
  .searchbox {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 40px;
    padding: 0 12px;
    border-radius: 999px;
    background: var(--fill);
    color: var(--text-3);
    font-size: 15px;
  }
  .avatar {
    width: 34px; height: 34px; border-radius: 9px; flex: 0 0 34px;
    background:
      repeating-conic-gradient(var(--success) 0% 25%, #B9F0C8 0% 50%) 50% / 9px 9px;
    opacity: .85;
  }

  .greeting {
    padding: 0 16px 12px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-1);
  }

  /* 区块标题 */
  .section {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 16px 8px;
    color: var(--text-1);
  }
  .section .ic { display: inline-flex; color: var(--icon-1); }
  .section b { font-size: 13px; line-height: 18px; font-weight: 700; }
  .section .spacer { flex: 1; }
  .section .act { display: inline-flex; color: var(--icon-2); }

  /* ───────── 待处理卡片（三种画法共用外壳） ───────── */
  .todo-card {
    margin: 0 16px;
    border: 1px solid var(--border-emphasis);
    border-radius: 10px;
    background: var(--canvas);
    /* 不用 overflow:hidden —— 标注红圈挂在角上，会被裁掉；圆角靠 border-radius 自己就够 */
  }
  /* 两行型：标题 + 计数两行，压到 48dp（原来是 56dp） */
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; min-height: 48px; }
  .row + .row { border-top: 1px solid var(--divider); }
  .row .dot {
    width: 22px; height: 22px; flex: 0 0 22px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
  }
  .row .dot i { width: 7px; height: 7px; border-radius: 50%; display: block; }
  .row .txt { flex: 1; min-width: 0; }
  .row .txt b { display: block; font-size: 13px; line-height: 17px; font-weight: 600; color: var(--text-1); }
  .row .txt span { display: block; font-size: 11px; line-height: 14px; color: var(--text-3); }
  .row.off .txt b { color: var(--text-3); }
  .row .chev { font-size: 15px; color: var(--text-3); line-height: 1; }

  /* 单行型：标题 + 计数同行，44dp —— 与折叠头等高，整块变成 44 的整数倍 */
  .row.one { min-height: 44px; padding: 0 12px; }
  .row.one .txt b { line-height: 18px; }
  .row.one .count {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }
  .row.one.off .count { color: var(--text-3); opacity: .75; }
  .row.one .chev { margin-left: 6px; }

  /* 现状：居中两行 */
  .empty-current { padding: 22px 16px; text-align: center; }
  .empty-current .t { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--text-2); }
  .empty-current .h { font-size: 11.5px; line-height: 17px; color: var(--text-3); margin-top: 4px; }

  /* 新设计：无框 + 可折叠头（折叠头就是原来的区块标题） */
  .fold {
    margin: 0 16px;
    border-radius: 10px;
    background: var(--fill);
  }
  .fold-head {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    padding: 0 12px;
    cursor: pointer;
  }
  .fold-head .ic { display: inline-flex; color: var(--icon-1); }
  .fold-head b { font-size: 13px; font-weight: 700; color: var(--text-1); }
  .fold-head .sum { margin-left: auto; font-size: 13px; color: var(--text-3); }
  .fold-head .sum .n { font-weight: 600; color: var(--text-1); }
  .fold-head .chev { display: inline-flex; color: var(--icon-2); margin-left: 2px; }
  .fold-head .chev svg { transition: transform 420ms cubic-bezier(.2, 1.45, .34, 1); }
  .fold-head:active { background: var(--press); border-radius: 10px; }
  /* .fold-body 只负责高度动画，**不裁切**（否则标注圈和编号会被自己裁掉）；
     真正的裁切交给内层 .fold-clip。 */
  .fold-body { position: relative; }
  .fold-clip { overflow: hidden; height: 100%; }
  .fold.is-collapsed .fold-body { height: 0; }
  .fold.is-collapsed .fold-body.anno-box { outline: none; }
  .fold.is-collapsed .fold-body.anno-box::after { display: none; }
  .fold-inner { border-top: 1px solid var(--divider); }
  .fold.is-collapsed .fold-head .chev svg { transform: rotate(-90deg); }

  /* 展开体：取数失败 */
  .failrow { display: flex; align-items: center; gap: 10px; padding: 8px 12px; min-height: 48px; }
  .failrow .lead { width: 18px; height: 18px; flex: 0 0 18px; display: flex; align-items: center; justify-content: center; color: var(--danger); }
  .failrow .txt { flex: 1; min-width: 0; }
  .failrow .txt b { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); }
  .failrow .txt span { display: block; font-size: 12px; color: var(--text-3); margin-top: 1px; }
  .failrow .retry {
    flex: 0 0 auto;
    font-size: 12px; font-weight: 600; color: var(--link);
    padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);
  }

  /* 骨架 */
  .sk { padding: 8px 12px; min-height: 48px; display: flex; align-items: center; gap: 10px; }
  .sk.one { min-height: 44px; padding: 0 12px; }
  .sk + .sk { border-top: 1px solid var(--divider); }
  .sk .blk, .sk .l1, .sk .l2 {
    background: var(--shimmer);
    border-radius: 4px;
    animation: breathe 700ms ease-in-out infinite alternate;
  }
  .sk .blk { width: 22px; height: 22px; flex: 0 0 22px; border-radius: 7px; }
  .sk .l1 { width: 92px; height: 11px; }
  .sk .l2 { width: 54px; height: 9px; margin-top: 6px; }
  @keyframes breathe { from { opacity: .55; } to { opacity: 1; } }

  /* 仓库卡片（只为了给出真实的首屏重量） */
  .repo { margin: 0 16px 10px; border-radius: 12px; background: var(--canvas-subtle); padding: 14px; }
  .repo .name { font-size: 15px; font-weight: 600; color: var(--link); }
  .repo .desc { font-size: 13px; color: var(--text-2); margin-top: 4px; line-height: 1.5; }
  .repo .meta { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--text-2); align-items: center; }
  .repo .meta .lang { display: inline-flex; align-items: center; gap: 4px; }
  .repo .meta .lang i { width: 10px; height: 10px; border-radius: 50%; display: block; }
  .repo .meta .pair { display: inline-flex; align-items: center; gap: 2px; }

  /* 底部导航 */
  .navbar {
    height: 56px;
    flex: 0 0 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 96px;
    border-top: 1px solid var(--fill-strong);
    background: var(--canvas);
  }
  .nav-home {
    width: 96px; height: 34px; border-radius: 999px;
    background: var(--info-soft);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
  }
  .nav-bell { position: relative; color: var(--text-2); display: flex; }
  .nav-bell .badge {
    position: absolute; top: -6px; right: -8px;
    min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 8px;
    background: #CF222E; color: #fff;
    font-size: 10px; line-height: 16px; text-align: center; font-weight: 600;
  }

  /* 标注 */
  body.annotate .anno-box { outline: 2px dashed #F85149; outline-offset: 3px; position: relative; }
  body.annotate .anno-box::after {
    content: attr(data-a);
    position: absolute;
    top: -11px;
    left: -11px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #F85149;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    line-height: 20px;
    text-align: center;
    z-index: 3;
  }

  /* 右侧说明栏 */
  .notes {
    flex: 1 1 300px;
    min-width: 280px;
    max-width: 420px;
    padding: 16px 18px;
    border-radius: 14px;
    background: var(--canvas-subtle);
    border: 1px solid var(--fill-strong);
  }
  .notes h3 { margin: 0 0 4px; font-size: 13px; letter-spacing: .02em; }
  .notes .sub { margin: 0 0 14px; font-size: 12px; color: var(--text-3); }
  .notes ol { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 12px; }
  .notes li { display: flex; gap: 10px; font-size: 12.5px; line-height: 1.6; color: var(--text-2); }
  .notes li .n {
    flex: 0 0 20px; width: 20px; height: 20px; border-radius: 50%;
    background: #F85149; color: #fff; font-size: 11px; font-weight: 700;
    text-align: center; line-height: 20px;
  }
  .notes .verdict {
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--fill-strong);
    font-size: 12px; color: var(--text-3); line-height: 1.7;
  }
  .notes .verdict b { color: var(--text-1); }

  .meter {
    max-width: 900px;
    margin: 20px auto 0;
    padding: 12px 16px;
    border-radius: 12px;
    background: var(--canvas-subtle);
    border: 1px solid var(--fill-strong);
    font-size: 12px;
    color: var(--text-2);
    line-height: 1.8;
  }
  .meter b { color: var(--text-1); }
  .meter table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 12px; }
  .meter th, .meter td { text-align: left; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--fill-strong); }
  .meter th { color: var(--text-3); font-weight: 500; }
  .meter td.num { font-variant-numeric: tabular-nums; color: var(--text-1); font-weight: 600; }

  @media (max-width: 820px) {
    .device { width: 100%; max-width: 390px; height: 720px; }
    .navbar { flex: 0 0 56px; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="group">
    <span class="label">版本</span>
    <div class="seg" id="seg-version">
      <button data-v="current" aria-pressed="false">现状（黑框）</button>
      <button data-v="new" aria-pressed="true">新设计（无框折叠）</button>
    </div>
  </div>
  <div class="group">
    <span class="label">折叠</span>
    <div class="seg" id="seg-collapse">
      <button data-v="expanded" aria-pressed="false">展开</button>
      <button data-v="collapsed" aria-pressed="true">折叠</button>
    </div>
  </div>
  <div class="group">
    <span class="label">行型</span>
    <div class="seg" id="seg-row">
      <button data-v="one" aria-pressed="true">单行 · 44</button>
      <button data-v="two" aria-pressed="false">两行 · 48</button>
    </div>
  </div>
  <div class="group">
    <span class="label">状态</span>
    <div class="seg" id="seg-state">
      <button data-v="content" aria-pressed="false">有内容</button>
      <button data-v="empty" aria-pressed="true">空</button>
      <button data-v="loading" aria-pressed="false">加载中</button>
      <button data-v="fail" aria-pressed="false">取数失败</button>
    </div>
  </div>
  <div class="group">
    <span class="label">主题</span>
    <div class="seg" id="seg-theme">
      <button data-v="light" aria-pressed="true">浅色</button>
      <button data-v="dark" aria-pressed="false">深色</button>
    </div>
  </div>
  <label class="chk"><input type="checkbox" id="chk-annotate" /> 显示标注</label>
</div>

<div class="stage">
  <div class="device">
    <div class="statusbar">
      <span>21:03</span>
      <span class="right">
        <span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></span>
        <span class="batt"></span>
        <span>39%</span>
      </span>
    </div>
    <div class="screen" id="screen"></div>
    <div class="navbar">
      <div class="nav-home">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M6.906.664a1.749 1.749 0 0 1 2.187 0l5.25 4.2c.415.332.657.835.657 1.367v7.019A1.75 1.75 0 0 1 13.25 15h-3.5a.75.75 0 0 1-.75-.75V9H7v5.25a.75.75 0 0 1-.75.75h-3.5A1.75 1.75 0 0 1 1 13.25V6.23c0-.531.242-1.034.657-1.366l5.25-4.2Z"/></svg>
      </div>
      <div class="nav-bell">
        <svg width="21" height="21" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 16a2 2 0 0 0 1.985-1.75c.017-.137-.097-.25-.235-.25h-3.5c-.138 0-.252.113-.235.25A2 2 0 0 0 8 16ZM3 5a5 5 0 0 1 10 0v2.947c0 .05.015.098.042.139l1.703 2.555A1.519 1.519 0 0 1 13.482 13H2.518a1.516 1.516 0 0 1-1.263-2.36l1.703-2.554A.255.255 0 0 0 3 7.947Zm5-3.5A3.5 3.5 0 0 0 4.5 5v2.947c0 .346-.102.683-.294.97l-1.703 2.556a.017.017 0 0 0-.003.01l.001.006c0 .002.002.004.004.006l.006.004.007.001h10.964l.007-.001.006-.004.004-.006.001-.007a.017.017 0 0 0-.003-.01l-1.703-2.554a1.745 1.745 0 0 1-.294-.97V5A3.5 3.5 0 0 0 8 1.5Z"/></svg>
        <span class="badge" id="nav-badge">1</span>
      </div>
    </div>
  </div>

  <aside class="notes">
    <h3>这张图在说什么</h3>
    <p class="sub" id="notes-sub">现状 · 空</p>
    <ol id="notes-list"></ol>
    <div class="verdict" id="notes-verdict"></div>
  </aside>
</div>

<div class="meter" id="meter"></div>

<script>
(function () {
  "use strict";

  const state = { version: "new", data: "empty", collapsed: true, row: "one", theme: "light" };

  // ── 数据（与 HomeScreen.kt 现状一致） ──
  const ROWS = [
    { title: "未读通知", value: "1 条",     count: 1, bg: "var(--info-soft)",       fg: "var(--accent)" },
    { title: "待我审查", value: "0 个 PR",  count: 0, bg: "var(--success-surface)", fg: "var(--success)" },
    { title: "分配给我", value: "0 个讨论", count: 0, bg: "var(--warning-surface)", fg: "var(--warning-strong)" }
  ];
  const ZERO = ["0 条", "0 个 PR", "0 个讨论"];

  const ICON = {
    bell: '<svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 16a2 2 0 0 0 1.985-1.75c.017-.137-.097-.25-.235-.25h-3.5c-.138 0-.252.113-.235.25A2 2 0 0 0 8 16ZM3 5a5 5 0 0 1 10 0v2.947c0 .05.015.098.042.139l1.703 2.555A1.519 1.519 0 0 1 13.482 13H2.518a1.516 1.516 0 0 1-1.263-2.36l1.703-2.554A.255.255 0 0 0 3 7.947Zm5-3.5A3.5 3.5 0 0 0 4.5 5v2.947c0 .346-.102.683-.294.97l-1.703 2.556a.017.017 0 0 0-.003.01l.001.006c0 .002.002.004.004.006l.006.004.007.001h10.964l.007-.001.006-.004.004-.006.001-.007a.017.017 0 0 0-.003-.01l-1.703-2.554a1.745 1.745 0 0 1-.294-.97V5A3.5 3.5 0 0 0 8 1.5Z"/></svg>',
    folder: '<svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5a.25.25 0 0 1-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75Z"/></svg>',
    tune: '<svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1" y="3" width="14" height="1.6" rx=".8"/><rect x="1" y="7.2" width="14" height="1.6" rx=".8"/><rect x="1" y="11.4" width="14" height="1.6" rx=".8"/><circle cx="5" cy="3.8" r="1.9"/><circle cx="11" cy="8" r="1.9"/><circle cx="7" cy="12.2" r="1.9"/></svg>',
    search: '<svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"/></svg>',
    checkCircle: '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16Zm3.78-9.72-4.25 4.25a.75.75 0 0 1-1.06 0L4.22 8.28a.75.75 0 1 1 1.06-1.06l1.72 1.72 3.72-3.72a.75.75 0 0 1 1.06 1.06Z"/></svg>',
    warnCircle: '<svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16ZM9 4v5a1 1 0 1 1-2 0V4a1 1 0 0 1 2 0Zm-1 8.5a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"/></svg>',
    star: '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>',
    fork: '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.878a2.25 2.25 0 1 1 1.5 0v.878a2.25 2.25 0 0 1-2.25 2.25h-1.5v2.128a2.251 2.251 0 1 1-1.5 0V8.5h-1.5A2.25 2.25 0 0 1 3.5 6.25v-.878a2.25 2.25 0 1 1 1.5 0ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm6.75.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm-3 8.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"/></svg>',
    chevDown: '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M12.78 5.22a.749.749 0 0 1 0 1.06l-4.25 4.25a.749.749 0 0 1-1.06 0L3.22 6.28a.749.749 0 1 1 1.06-1.06L8 8.939l3.72-3.719a.749.749 0 0 1 1.06 0Z"/></svg>'
  };

  // 折叠头的摘要：**折叠不等于空**，摘要要说清「有几件事 / 没事了 / 读不到」
  const SUMMARY = {
    content: '<span class="n">1</span> 项待办',
    empty: "都处理完了",
    loading: "读取中…",
    fail: "暂时取不到"
  };

  // ── 标注：渲染时按出现顺序登记，编号与页面上的红圈一一对应 ──
  let notes = [];
  function mark(text) {
    const n = notes.length + 1;
    notes.push({ n: n, text: text });
    return 'data-a="' + n + '"';
  }

  function rowHTML(r, opts) {
    const o = opts || {};
    const enabled = o.forcedOff ? false : r.count > 0;
    const chev = o.chevron ? (o.chevron === "always" ? true : enabled) : false;
    const dot = '<span class="dot" style="background:' + r.bg + '"><i style="background:' + r.fg + '"></i></span>';
    // 单行型：标题 + 计数同一行（计数靠右），44dp —— 和折叠头等高
    if (o.one) {
      return '<div class="row one ' + (enabled ? "" : "off") + '">' + dot +
        '<span class="txt"><b>' + r.title + '</b></span>' +
        '<span class="count">' + r.value + '</span>' +
        (chev ? '<span class="chev">›</span>' : '') +
      '</div>';
    }
    return '<div class="row ' + (enabled ? "" : "off") + '">' + dot +
      '<span class="txt"><b>' + r.title + '</b><span>' + r.value + '</span></span>' +
      (chev ? '<span class="chev">›</span>' : '') +
    '</div>';
  }

  function rowsHTML(opts) {
    const o = opts || {};
    const rows = o.zero
      ? ROWS.map(function (r, i) { return { title: r.title, value: ZERO[i], count: 0, bg: r.bg, fg: r.fg }; })
      : ROWS;
    return rows.map(function (r) { return rowHTML(r, o); }).join("");
  }

  function skeleton(n, one) {
    let out = "";
    for (let i = 0; i < n; i++) {
      out += '<div class="sk' + (one ? " one" : "") + '">' +
        '<div class="blk"></div>' +
        '<div style="flex:1"><div class="l1"></div><div class="l2"></div></div>' +
      '</div>';
    }
    return out;
  }

  function foldHead(summary, attr) {
    return '<div class="fold-head anno-box" ' + attr + '>' +
      '<span class="ic">' + ICON.bell + '</span>' +
      '<b>待处理</b>' +
      '<span class="sum">' + summary + '</span>' +
      '<span class="chev">' + ICON.chevDown + '</span>' +
    '</div>';
  }

  function foldBody(data, one) {
    if (data === "content") return rowsHTML({ chevron: "enabled", one: one });
    if (data === "empty") return rowsHTML({ chevron: "none", zero: true, forcedOff: true, one: one });
    if (data === "loading") return skeleton(3, one);
    return '<div class="failrow">' +
      '<span class="lead">' + ICON.warnCircle + '</span>' +
      '<span class="txt"><b>暂时取不到待办</b><span>网络似乎不通，数字可能不是最新的</span></span>' +
      '<span class="retry">重试</span>' +
    '</div>';
  }

  function todoBlock(version, data, collapsed, one) {
    notes = [];

    // ── 现状：黑框卡片，标题在卡片外，空态把三行吞掉 ──
    if (version === "current") {
      const head = '<div class="section"><span class="ic">' + ICON.bell + '</span><b>待处理</b></div>';
      if (data === "content") {
        const a = mark("现状：1dp 纯黑描边（浅色 borderEmphasis = #000000）+ 3 行；0 的两行仍带 ›。");
        return { html: '<div class="region">' + head +
          '<div class="todo-card anno-box" ' + a + '>' + rowsHTML({ chevron: "always" }) + '</div></div>' };
      }
      const a = mark("现状：加载中 / 取数失败 / 真的为空 —— 三态同一帧，断网时首页会断言「没有待办」。");
      return { html: '<div class="region">' + head +
        '<div class="todo-card"><div class="empty-current anno-box" ' + a + '>' +
          '<div class="t">没有待办</div>' +
          '<div class="h">需要你处理的 PR / 讨论 / 通知会出现在这里</div>' +
        '</div></div></div>' };
    }

    // ── 新设计：无框 + 折叠头 ──
    const headAttr = mark("去掉 1dp 纯黑描边，改浅底 + 圆角；标题行变成折叠头（44dp，整行可点）：右侧摘要「" +
      (data === "content" ? "1 项待办" : data === "empty" ? "都处理完了" : data === "loading" ? "读取中" : "暂时取不到") +
      "」，箭头随折叠旋转。");
    // 体**常驻 DOM**（折叠时高度 0）：这样点折叠头只切 class + 动一次高度，
    // 不重建节点 —— 重建会让 CSS 过渡失效、也会把页面滚回顶部。
    const bodyAttr = collapsed ? "" : mark(
      data === "empty" ? "空态不再需要单独的空态卡片：默认折叠即可（展开仍能看到三行 0，入口没丢）。" :
      data === "loading" ? "展开体是骨架，行高照实；折叠头高度固定，取数前后不跳。" :
      data === "fail" ? "失败时摘要直接说「暂时取不到」，展开体给可点的「重试」，不冒充空态。" :
      "行压到 44（单行）/ 48（两行），与 44 的折叠头同节奏；0 行不再画箭头。"
    );
    return {
      html: '<div class="region"><div class="fold' + (collapsed ? " is-collapsed" : "") + '">' +
        foldHead(SUMMARY[data], headAttr) +
        '<div class="fold-body' + (collapsed ? "" : " anno-box") + '"' + (bodyAttr ? " " + bodyAttr : "") + '>' +
          '<div class="fold-clip"><div class="fold-inner">' + foldBody(data, one) + '</div></div>' +
        '</div>' +
      '</div></div>'
    };
  }

  const VERDICT = {
    current: {
      content: "<b>现状</b>：黑框卡片 + 三行；0 的两行仍带箭头（不可点却给暗示）。",
      empty: "<b>现状</b>：一句「没有待办」，同时冒充加载中与断网；首屏被吃掉约 105px，且没有出口。",
      loading: "<b>现状</b>：用户看到的是「没有待办」，不是「正在取」。",
      fail: "<b>现状</b>：断网 = 「没有待办」——这是假话，用户无从判断。"
    },
    new: {
      content: "<b>新设计</b>：无框 + 浅底，层级比黑框轻；折叠头本身就是入口，展开是详情。",
      empty: "<b>新设计</b>：空态＝折叠态。一句「都处理完了」占 44dp，展开后仍能看到三行 0。",
      loading: "<b>新设计</b>：摘要「读取中…」，展开体是骨架，不冒充空态。",
      fail: "<b>新设计</b>：摘要说「暂时取不到」，展开体给「重试」；不知道 ≠ 没有。"
    }
  };

  const COLLAPSE_NOTE = {
    content: "<b>已折叠</b>：整块只剩 44dp，摘要「1 项待办」；取数照常，数字变了摘要自己会变 —— 折叠只影响可见性，不冻结刷新。",
    empty: "<b>已折叠</b>：44dp，一句「都处理完了」。",
    loading: "<b>已折叠</b>：44dp，摘要「读取中…」。",
    fail: "<b>已折叠</b>：44dp，摘要「暂时取不到」——展开才能看到重试。"
  };

  function detailHTML() {
    return '' +
      '<div class="topbar">' +
        '<div class="searchbox">' + ICON.search + '<span>搜索 GitHub</span></div>' +
        '<div class="avatar"></div>' +
      '</div>' +
      '<div class="greeting">晚上好，SunsetRNE</div>' +
      '<div id="todo-slot"></div>' +
      '<div class="section" style="padding-top:12px">' +
        '<span class="ic">' + ICON.folder + '</span><b>常用仓库</b>' +
        '<span class="spacer"></span><span class="act">' + ICON.tune + '</span>' +
      '</div>' +
      '<div class="repo">' +
        '<div class="name">erkayaman/rust-anything</div>' +
        '<div class="desc">Rewrite your whole app in Rust, one piece at a time, checked against the original\'s recorded behavior at every step.</div>' +
        '<div class="meta">' +
          '<span class="lang"><i style="background:#DEA584"></i>Rust</span>' +
          '<span class="pair">' + ICON.star + '9.5k</span>' +
          '<span class="pair">' + ICON.fork + '775</span>' +
        '</div>' +
      '</div>' +
      '<div class="repo">' +
        '<div class="name">sakurakingfifth-debug/PUIInstaller</div>' +
        '<div class="desc">null</div>' +
        '<div class="meta">' +
          '<span class="lang"><i style="background:#A97BFF"></i>Kotlin</span>' +
          '<span class="pair">' + ICON.star + '300</span>' +
          '<span class="pair">' + ICON.fork + '7</span>' +
        '</div>' +
      '</div>';
  }

  function render() {
    document.documentElement.dataset.theme = state.theme;

    const screen = document.getElementById("screen");
    screen.innerHTML = detailHTML();

    const block = todoBlock(state.version, state.data, state.collapsed, state.row === "one");
    document.getElementById("todo-slot").outerHTML = block.html;

    document.body.classList.toggle("annotate", document.getElementById("chk-annotate").checked);

    updatePanel();
    syncSegs();
    measure();
  }

  /** 只刷新右侧说明栏与底栏徽标（重建一版 markup 只为拿到标注文案，结果不插入 DOM） */
  function updatePanel() {
    todoBlock(state.version, state.data, state.collapsed, state.row === "one");

    const versionName = state.version === "current" ? "现状" : "新设计 · 无框折叠";
    const dataName = ({ content: "有内容", empty: "空", loading: "加载中", fail: "取数失败" })[state.data];
    document.getElementById("notes-sub").textContent =
      versionName + " · " + dataName + (state.version === "new" ? (state.collapsed ? " · 折叠" : " · 展开") : "");

    const list = document.getElementById("notes-list");
    list.innerHTML = notes.map(function (n) {
      return '<li><span class="n">' + n.n + '</span><span>' + n.text + '</span></li>';
    }).join("") || '<li><span class="n">·</span><span>这一态没有可标注的问题。</span></li>';

    let verdict = VERDICT[state.version][state.data];
    if (state.version === "new" && state.collapsed) verdict += "<br><br>" + COLLAPSE_NOTE[state.data];
    document.getElementById("notes-verdict").innerHTML = verdict;

    const badge = document.getElementById("nav-badge");
    if (badge) badge.style.display = state.data === "content" ? "block" : "none";
  }

  /**
   * 折叠 / 展开：先量高，再用回弹曲线动一次。
   * 展开 420ms 带过冲（cubic-bezier 的 y 超过 1），收起 260ms 用减速曲线 ——
   * 两个方向刻意不同：展开要「弹出来」，收起要「干脆收走」。
   * 不重建 DOM：重建会让 CSS 过渡失效，也会把 #screen 滚回顶部。
   */
  function toggleFold(fold) {
    const body = fold.querySelector(".fold-body");
    if (!body) return;
    if (body.getAnimations) body.getAnimations().forEach(function (a) { a.cancel(); });

    const expanding = fold.classList.contains("is-collapsed");
    // 折叠时 .fold-clip 是 0 高，body.scrollHeight 会量成 0；要量的是**未被裁切**的内层
    const inner = body.querySelector(".fold-inner");
    const h = inner ? inner.offsetHeight : body.scrollHeight;

    state.collapsed = !expanding;
    fold.classList.toggle("is-collapsed", !expanding);

    if (body.animate) {
      if (expanding) {
        body.animate(
          [{ height: "0px", opacity: 0.3 }, { height: h + "px", opacity: 1 }],
          { duration: 420, easing: "cubic-bezier(.2, 1.45, .34, 1)" }
        );
      } else {
        body.animate(
          [{ height: h + "px", opacity: 1 }, { height: "0px", opacity: 0.3 }],
          { duration: 260, easing: "cubic-bezier(.4, 0, .55, .2)" }
        );
      }
    }

    syncSegs();
    updatePanel();
  }

  function syncSegs() {
    const pressed = {
      "seg-version": state.version,
      "seg-state": state.data,
      "seg-theme": state.theme,
      "seg-collapse": state.collapsed ? "collapsed" : "expanded",
      "seg-row": state.row
    };
    Object.keys(pressed).forEach(function (id) {
      const box = document.getElementById(id);
      if (!box) return;
      Array.prototype.forEach.call(box.querySelectorAll("button"), function (b) {
        b.setAttribute("aria-pressed", String(b.dataset.v === pressed[id]));
        if (id === "seg-collapse" || id === "seg-row") b.disabled = state.version === "current";
      });
    });
  }

  // ── 实测高度：整块「待处理」区（含标题），浏览器按 px 量 ──
  function measure() {
    const probe = document.createElement("div");
    probe.style.cssText = "position:absolute;left:-9999px;top:0;width:390px;visibility:hidden";
    document.body.appendChild(probe);

    const cases = [
      ["现状 · 空（黑框卡片）", "current", "empty", true],
      ["现状 · 有内容", "current", "content", true],
      ["新设计 · 折叠", "new", "empty", true],
      ["新设计 · 展开（空）", "new", "empty", false],
      ["新设计 · 展开（有内容）", "new", "content", false]
    ];
    const rows = cases.map(function (c) {
      probe.innerHTML = todoBlock(c[1], c[2], c[3], state.row === "one").html;
      const el = probe.firstElementChild;
      return [c[0], el ? Math.round(el.getBoundingClientRect().height) : 0];
    });
    probe.remove();

    notes = [];

    document.getElementById("meter").innerHTML =
      '<b>实测高度</b>（整个「待处理」区，含标题行；390dp 宽、当前主题，浏览器按 px 量）：' +
      '<table>' +
        '<tr><th>形态</th><th>高度</th></tr>' +
        rows.map(function (r) {
          return '<tr><td>' + r[0] + '</td><td class="num">' + r[1] + ' px</td></tr>';
        }).join("") +
      '</table>' +
      '<div style="margin-top:8px;color:var(--text-3)">' +
        '折叠头固定 44px；空态从「一张约 85px 的卡片」变成「44px 的一行」；' +
        '展开高度随行型变化：单行 44 / 两行 48（原来是 56）。' +
      '</div>';
  }

  // ── 控件 ──
  function bindSeg(id, apply) {
    const box = document.getElementById(id);
    if (!box) { console.warn("[prototype] 找不到控件:", id); return; }
    box.addEventListener("click", function (e) {
      const btn = e.target.closest("button");
      if (!btn || btn.disabled) return;
      apply(btn.dataset.v);
      render();
    });
  }

  bindSeg("seg-version", function (v) {
    state.version = v;
    if (v === "new") state.collapsed = state.data === "empty";
  });
  bindSeg("seg-state", function (v) {
    state.data = v;
    state.collapsed = v === "empty";
  });
  bindSeg("seg-theme", function (v) { state.theme = v; });
  bindSeg("seg-row", function (v) { state.row = v; });
  bindSeg("seg-collapse", function (v) { state.collapsed = v === "collapsed"; });

  // 真实交互：点折叠头展开 / 收起（动画，不重建 DOM）
  document.getElementById("screen").addEventListener("click", function (e) {
    const head = e.target.closest(".fold-head");
    if (head && head.parentElement) toggleFold(head.parentElement);
  });

  document.getElementById("chk-annotate").addEventListener("change", render);

  // 给 smoke.js 与手动调试用：脚本级验收不看 DOM 就能断言状态
  if (typeof window !== "undefined") window.__protoState = state;

  // 默认：新设计 · 空 · 折叠（就是「去掉黑框 + 可折叠」之后应有的样子），并开标注
  document.getElementById("chk-annotate").checked = true;
  render();
})();
</script>

</body>
</html>
