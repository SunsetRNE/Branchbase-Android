# 无限定符资源（`res/values/`）**本身是哪一种语言**。
#
# 为什么必须有这个文件 —— Android Studio / AGP 的「自动按应用设置语言」
# （app/build.gradle.kts 的 androidResources.generateLocaleConfig）要生成语言清单，
# 而它只能从 `values-*` 目录名看出「有哪些语言」，看不出**默认的那份**是什么语言。
# 缺了它，`:app:extractDebugSupportedLocales` 会直接失败：
#   No resources.properties file found. See .../automatic-per-app-languages
#
# 值必须是 BCP-47 语言标签，且要和 `res/values/` 里实际使用的语言一致：
# 本项目的默认资源是**简体中文**，所以是 zh-Hans（不是 zh，也不是 zh-CN ——
# zh 只说明「中文」，不区分简繁；简体要用 Hans 脚本子标签）。
#
# 改动这个值等于**改了默认语言**：所有 values-en 里没有的条目都会回落到这里，
# 而语言清单里的第一项也会跟着变。
unqualifiedResLocale=zh-Hans
